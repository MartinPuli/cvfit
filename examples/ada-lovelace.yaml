# cv-converter profile. This is the file you edit.
#
# Everything optional is optional: leave out any section you do not have. A
# student with no work history keeps Education, Projects and Skills; someone
# with no side projects drops Projects. The builder never invents a section.
#
# priority: higher survives when the page runs out. 50 is the default. Give
# the one thing you would never cut a 95 and the nice-to-have a 40.

name: Ada Lovelace
contact:
  - London, United Kingdom
  - ada@example.com
  - github.com/example
  - linkedin.com/in/example

# Two or three lines. Only rendered for --kind job; the skill rewrites it per posting.
summary: >-
  Backend engineer, four years shipping payment and ledger systems at two fintechs.
  Led the migration of a card-issuing platform off a monolith with no customer-facing
  downtime, and built the reconciliation service that closed a recurring six-figure gap.

